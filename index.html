    <!-- Suppress browser extension errors FIRST (before anything else loads) -->
    <script>
      (function() {
        'use strict';
        // Aggressive error suppression for browser extensions
        var suppressExtensionError = function(e) {
          if (!e) return false;
          var msg = (e.message || e.reason?.message || String(e.reason) || String(e) || '').toLowerCase();
          var filename = (e.filename || e.source || '').toLowerCase();
          var errorName = (e.error?.name || e.reason?.name || '').toLowerCase();
          
          var patterns = [
            'blocked a frame with origin',
            'failed to read a named property',
            'securityerror',
            'inpage.js',
            'extension://',
            'chrome-extension://',
            'moz-extension://',
            'content-script',
            'truvamate-9e0fa.firebaseapp.com',
            'isrisk',
            'cross-origin',
            'crossorigin',
            'xss-auditor',
            'metamask',
            'wallet'
          ];
          
          var combined = msg + ' ' + filename + ' ' + errorName;
          return patterns.some(function(p) { return combined.indexOf(p) !== -1; }) || errorName === 'securityerror';
        };
        
        // Catch all errors
        var origOnError = window.onerror;
        window.onerror = function(msg, source, lineno, colno, error) {
          if (suppressExtensionError({message: msg, filename: source, error: error})) {
            return true;
          }
          return origOnError ? origOnError.call(this, msg, source, lineno, colno, error) : false;
        };
        
        // Catch unhandled promise rejections
        window.addEventListener('unhandledrejection', function(e) {
          if (suppressExtensionError({reason: e.reason})) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
        
        // Catch all errors via event listener
        window.addEventListener('error', function(e) {
          if (suppressExtensionError(e)) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
        
        // Suppress console.error
        var origConsoleError = console.error;
        console.error = function() {
          var msg = Array.prototype.slice.call(arguments).join(' ').toLowerCase();
          if (!suppressExtensionError({message: msg})) {
            origConsoleError.apply(console, arguments);
          }
        };
        
        // Suppress console.warn for extension warnings
        var origConsoleWarn = console.warn;
        console.warn = function() {
          var msg = Array.prototype.slice.call(arguments).join(' ').toLowerCase();
          if (!suppressExtensionError({message: msg})) {
            origConsoleWarn.apply(console, arguments);
          }
        };
      })();
    </script>
